<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to the StudentSpace Community</title>
    <link rel="stylesheet" href="css\all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <img
        src="assets\images\logo\vector\default-monochrome-white.svg"
        alt="header logo"
        id="logo-header"
      />
      <nav>
        <a href="index.html" id="home"><span class="minis">Home</span></a>
        <a href="index.html"><span class="minis">About Us</span></a>
        <a href="index.html"><span class="minis">Tools</span></a>
        <a href="index.html"><span class="minis">Apps</span></a>
      </nav>
    </header>
    <main>
      <div class="hero">
        <section class="welcome">
          <h1>Welcome to StudentSpace!</h1>
          <p>
            Nigeria's first fully functional community made specifically for
            university students.
          </p>
        </section>
        <section class="what">
          <span class="card-header"> Why StudentSpace? </span>
          <div class="what-grid">
            <span id="what-top1" class="what-minis">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-unlink preview-icon"
              >
                <path
                  d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"
                />
                <path
                  d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"
                />
                <line x1="8" x2="8" y1="2" y2="5" />
                <line x1="2" x2="5" y1="8" y2="8" />
                <line x1="16" x2="16" y1="19" y2="22" />
                <line x1="19" x2="22" y1="16" y2="16" />
              </svg>
              No corporate fluff</span
            >
            <span class="what-minis" id="what-top2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-code preview-icon"
              >
                <path d="m16 18 6-6-6-6" />
                <path d="m8 6-6 6 6 6" />
              </svg>
              Free & Open Source</span
            >
            <span id="what-middle1" class="what-minis">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-leaf preview-icon"
              >
                <path
                  d="M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20"
                />
                <path
                  d="M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13"
                />
              </svg>
              Eco-Friendly</span
            >
            <span id="what-middle2" class="what-minis">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-scale preview-icon"
              >
                <path d="M12 3v18" />
                <path d="m19 8 3 8a5 5 0 0 1-6 0zV7" />
                <path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1" />
                <path d="m5 8 3 8a5 5 0 0 1-6 0zV7" />
                <path d="M7 21h10" />
              </svg>
              Unbiased by default</span
            >
            <span id="what-bottom" class="what-minis">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-toolbox preview-icon"
              >
                <path d="M16 12v4" />
                <path d="M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2" />
                <path
                  d="M17 6a2 2 0 011.414.586l3 3A2 2 0 0122 11v8a2 2 0 01-2 2H4a2 2 0 01-2-2v-8a2 2 0 01.586-1.414l3-3A2 2 0 017 6z"
                />
                <path d="M2 14h20" />
                <path d="M8 12v4" />
              </svg>

              Devoted to making students better equipped</span
            >
          </div>
        </section>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
