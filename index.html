<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to the StudentSpace Community</title>
    <link rel="stylesheet" href="css\all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <img
        src="assets\images\logo\vector\default-monochrome-white.svg"
        alt="header logo"
        id="logo-header"
      />
      <nav>
        <a href="index.html"><span class="minis">Home</span></a>
        <a href="index.html"><span class="minis">About Us</span></a>
        <a href="index.html"><span class="minis">Tools</span></a>
        <a href="index.html"><span class="minis">Apps</span></a>
      </nav>
    </header>
    <main>
      <div class="hero">
        <section class="welcome">
          <h1>Welcome to StudentSpace!</h1>
          <p>
            Nigeria's first fully functional community made specifically for
            university students.
          </p>
        </section>
        <section class="what">
          <span class="card-header"> What are we? </span>
          <div class="what-grid">
            <span class="what-top1"
              ><img src="assets\icons\unlink.svg" alt="">An
              Independent Corporation</span
            >
            <span class="what-top2"
              ><i class="fa-solid fa-lock-open"></i>Free & Open Source</span
            >

            <span class="what-middle1"
              ><i class="fa-solid fa-leaf"></i>Eco-Friendly</span
            >
            <span class="what-middle2"
              ><i class="fa-solid fa-scale-balanced"></i>Unbiased by
              default</span
            >

            <span class="what-bottom"
              ><i class="fa-solid fa-fire"></i>Devoted to making students better
              equipped</span
            >
          </div>
        </section>
      </div>

    <footer></footer>
